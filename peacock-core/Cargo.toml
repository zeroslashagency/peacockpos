[package]
name = "peacock-core"
version = "0.1.0"
edition = "2021"
description = "URY POS domain logic ported to Rust. Pure logic, no I/O — storage is behind traits."

[dependencies]
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
rust_decimal_macros = "1.36"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1.4"
