[package]
name = "peacock-api"
version = "0.1.0"
edition = "2021"
description = "HTTP API layer for Peacock POS. Axum server, middleware stack, RFC 7807 errors."

[lib]
name = "peacock_api"
path = "src/lib.rs"

[[bin]]
name = "peacock-api"
path = "src/main.rs"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.47", features = ["full"] }
# `util` provides `ServiceExt::oneshot`, which the router tests drive the stack with.
tower = { version = "0.4.13", features = ["util"] }
tower-http = { version = "0.5.2", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
# Must match peacock-core: `BusinessDay::for_instant` takes chrono_tz::Tz across the
# crate boundary, and two chrono-tz majors produce two incompatible `Tz` types.
chrono-tz = "0.9"
rust_decimal = { version = "1.36", features = ["serde-str", "serde-with-str"] }
peacock-core = { path = "../peacock-core" }
peacock-storage = { path = "../peacock-storage" }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tokio-stream = { version = "0.1.19", features = ["sync"] }
async-trait = "0.1"
thiserror = "1.0"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
http-body-util = "0.1"
rust_decimal_macros = "1.37"
# The integration tests create and drop a scratch database per test, the same harness
# peacock-storage's tests use. Feature set matches peacock-storage so one sqlx is compiled.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-native-tls",
    "postgres",
    "json",
    "chrono",
    "rust_decimal",
    "uuid",
    "macros",
    "migrate",
] }
